name: CoCodex Windows private alpha

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: "Exact audited commit to package"
        required: true
        type: string
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/cocodex-server/**"
      - "packages/cocodex-protocol/**"
      - "src/cocodex/**"
      - "src/update/**"
      - "bin/ccx.mjs"
      - "bin/ccx-server.mjs"
      - "bin/ocx.mjs"
      - "scripts/Install-CoCodex.ps1"
      - "scripts/build-cocodex-private-alpha.ts"
      - "scripts/generate-cocodex-private-alpha-shrinkwrap.ts"
      - "scripts/private-alpha/**"
      - "scripts/verify-cocodex-private-alpha-install.ts"
      - "tests/cocodex-*.test.ts"
      - "tests/update-job.test.ts"
      - "gui/**"
      - "assets/**"
      - "package.json"
      - "bun.lock"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/cocodex-private-alpha.yml"

permissions:
  contents: read

concurrency:
  group: cocodex-private-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-runtime:
    name: Minimum Node 22.12/npm 10 contract
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify manual release commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[A-Fa-f0-9]{40}$') {
            throw "expected-sha must be a full 40-character commit."
          }
          if ($env:GITHUB_SHA -ne $env:EXPECTED_SHA) {
            throw "Checked out $env:GITHUB_SHA, expected $env:EXPECTED_SHA."
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup minimum Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          Push-Location gui
          bun install --frozen-lockfile
          Pop-Location

      - name: Validate minimum runtime
        run: |
          bun run typecheck:cocodex
          bun run test:cocodex
          bun run build:cocodex-private-alpha

      - name: Install and exercise exact minimum-runtime archive
        shell: pwsh
        run: |
          $release = Get-ChildItem -LiteralPath dist/private-alpha -Directory |
            Sort-Object Name |
            Select-Object -Last 1
          if (-not $release) {
            throw "Private-alpha release directory was not created."
          }
          $archive = Get-ChildItem -LiteralPath $release.FullName -Filter *.tgz -File
          if (@($archive).Count -ne 1) {
            throw "Expected exactly one private-alpha archive."
          }
          & (Join-Path $release.FullName "Install-CoCodex.ps1") `
            -Action Install `
            -PackagePath $archive.FullName `
            -ChecksumPath (Join-Path $release.FullName "SHA256SUMS.txt") `
            -ReleaseManifestPath (Join-Path $release.FullName "RELEASE.json") `
            -NpmPrefix (Join-Path $env:RUNNER_TEMP "cocodex-private-alpha-minimum") `
            -SkipPathUpdate
          bun run scripts/verify-cocodex-private-alpha-install.ts `
            --prefix (Join-Path $env:RUNNER_TEMP "cocodex-private-alpha-minimum")

  build-test-install:
    name: Build, test, install, and package
    needs: minimum-runtime
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify manual release commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[A-Fa-f0-9]{40}$') {
            throw "expected-sha must be a full 40-character commit."
          }
          if ($env:GITHUB_SHA -ne $env:EXPECTED_SHA) {
            throw "Checked out $env:GITHUB_SHA, expected $env:EXPECTED_SHA."
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          Push-Location gui
          bun install --frozen-lockfile
          Pop-Location

      - name: Typecheck and test CoCodex
        run: |
          bun run typecheck:cocodex
          bun run test:cocodex

      - name: Inherited OpenCodex regression
        run: bun run test:batched

      - name: GUI, builds, and privacy gates
        shell: pwsh
        run: |
          Push-Location gui
          bun test
          bun run lint
          bun run lint:i18n
          Pop-Location
          bun run build:cocodex-server
          bun run build:cocodex-client
          bun run privacy:scan

      - name: Build private-alpha bundle from clean commit
        run: |
          bun run build:cocodex-private-alpha

      - name: Install exact archive with npm
        shell: pwsh
        run: |
          $release = Get-ChildItem -LiteralPath dist/private-alpha -Directory |
            Sort-Object Name |
            Select-Object -Last 1
          if (-not $release) {
            throw "Private-alpha release directory was not created."
          }
          $archive = Get-ChildItem -LiteralPath $release.FullName -Filter *.tgz -File
          if (@($archive).Count -ne 1) {
            throw "Expected exactly one private-alpha archive."
          }
          & (Join-Path $release.FullName "Install-CoCodex.ps1") `
            -Action Install `
            -PackagePath $archive.FullName `
            -ChecksumPath (Join-Path $release.FullName "SHA256SUMS.txt") `
            -ReleaseManifestPath (Join-Path $release.FullName "RELEASE.json") `
            -NpmPrefix (Join-Path $env:RUNNER_TEMP "cocodex-private-alpha") `
            -SkipPathUpdate
          bun run scripts/verify-cocodex-private-alpha-install.ts `
            --prefix (Join-Path $env:RUNNER_TEMP "cocodex-private-alpha")

      - name: Upload verified Windows bundle
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cocodex-windows-private-alpha-${{ github.sha }}
          path: dist/private-alpha/**
          if-no-files-found: error
          retention-days: 14
